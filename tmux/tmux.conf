# Setup
# Deployed globally by kali-setup.sh: base dir is the configs repo clone, and
# /etc/tmux.conf one-line-sources this file. Change this path if the clone moves.
tmux_dir="/opt/tools/configs/tmux"
tmux_conf_dir="$tmux_dir/config"
tmux_plugins_dir="$tmux_dir/plugins"

# Configuration
source "$tmux_conf_dir/options.conf"
source "$tmux_conf_dir/keybindings.conf"
source "$tmux_conf_dir/theme.conf"

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$tmux_plugins_dir"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'

# Absolute paths: run-shell args go to /bin/sh, which doesn't know tmux's
# $tmux_plugins_dir. Keep in sync with tmux_dir above if the base path changes.
run "/opt/tools/configs/tmux/plugins/tpm/tpm"
run "/opt/tools/configs/tmux/plugins/tmux-mode-indicator/mode_indicator.tmux"
